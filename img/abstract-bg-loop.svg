<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Animated blue bokeh background</title>
  <desc id="desc">A high-key photographic bokeh background with a slow, seamless optical drift and gentle breathing light.</desc>

  <defs>
    <linearGradient id="soft-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#dce6ff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#2d43ff" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#fff9ed" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#eef3ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#eef3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#eef3ff"/>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-28 -18; -52 -30; -28 -18"
      keyTimes="0; .5; 1" dur="16s" repeatCount="indefinite" calcMode="spline"
      keySplines=".45 0 .55 1; .45 0 .55 1"/>
    <g transform-origin="800px 450px">
      <animateTransform attributeName="transform" type="scale"
        values="1.045; 1.085; 1.045"
        keyTimes="0; .5; 1" dur="16s" repeatCount="indefinite" calcMode="spline"
        keySplines=".45 0 .55 1; .45 0 .55 1"/>
      <image href="abstract-bg.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#soft-light)">
    <animate attributeName="opacity" values=".55;.82;.55" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </rect>

  <ellipse cx="360" cy="290" rx="390" ry="320" fill="url(#flare)" filter="url(#soften)" opacity=".38">
    <animate attributeName="cx" values="330;390;330" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="opacity" values=".28;.46;.28" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>
</svg>
